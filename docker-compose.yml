services:
    postgres:
        image: postgres:18
        restart: unless-stopped
        networks:
            omop: {}
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
        volumes:
            - omop_db_storage:/var/lib/postgresql
            # Vocabulary files are loaded with server side COPY statements
            - omop_install:/install_db:ro
        ports:
            - 5432:5432
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres"]
            interval: 5s
            timeout: 5s
            retries: 20
    omop-init:
        build: ./docker/omop-tools
        image: omop-tools:local
        networks:
            omop: {}
        environment:
            - PGHOST=postgres
            - PGUSER=postgres
            - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
            - VOCAB_URL=${VOCAB_URL:-https://surfdrive.surf.nl/s/syJN2z2XaR5eMmM/download}
            - DQD_PASSWORD=${DQD_PASSWORD:-dqd}
            - SUPERSET_DB_PASSWORD=${SUPERSET_DB_PASSWORD:-superset}
            - SUPERSET_READER_PASSWORD=${SUPERSET_READER_PASSWORD:-superset_reader}
        volumes:
            - omop_install:/install_db
            - ./setup_files:/setup_files:ro
        depends_on:
            postgres:
                condition: service_healthy
    pgadmin:
        image: dpage/pgadmin4
        restart: unless-stopped
        networks:
            omop: {}
        environment:
            - PGADMIN_DEFAULT_EMAIL=admin@omop.tld
            - PGADMIN_DEFAULT_PASSWORD=1234567890
            - PGADMIN_SERVER_JSON_FILE=/pgadmin_config/servers.json
        volumes:
            - ./setup_files/pgadmin:/pgadmin_config:ro
        # Copy the password file into the user's storage directory (admin@omop.tld -> admin_omop.tld),
        # as libpq requires it to be owned by the pgadmin user with 0600 permissions
        entrypoint: >
            /bin/sh -c "mkdir -p /var/lib/pgadmin/storage/admin_omop.tld &&
            cp /pgadmin_config/pgpass /var/lib/pgadmin/storage/admin_omop.tld/pgpass &&
            chmod 600 /var/lib/pgadmin/storage/admin_omop.tld/pgpass &&
            exec /entrypoint.sh"
        depends_on:
            - postgres
        ports:
            - 5555:80
networks:
    omop:
volumes:
    omop_db_storage:
    omop_install:
